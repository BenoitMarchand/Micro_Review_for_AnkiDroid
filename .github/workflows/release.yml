name: Release

# Started on request (Actions tab > Release > Run workflow, or `gh workflow run release.yml -f stage=...`), in two stages:
# - "rc" (default): a release candidate for users to validate. Sets the version on develop to the next minor
#   version with "-rc1" (or the next candidate, -rc2, -rc3...), tags vX.Y.0-rcN on develop and publishes the APK
#   as a GitHub pre-release. main is not changed.
# - "final": once the candidate is validated, drops the "-rcN" suffix, merges develop into main, tags vX.Y.0
#   and publishes the APK as the latest GitHub release, with the signed bundle for the Play Store.
# Nothing is tagged unless the device tests pass on an emulator.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'rc = new release candidate (pre-release), final = release the validated candidate'
        type: choice
        options: [rc, final]
        default: rc

env:
  # The name of the main module repository
  main_project_module: app

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  # A release is only tagged when the device tests (fake AnkiDroid, app/src/androidTest) pass on an emulator.
  device-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run the device tests on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.orlikalabs.microreview.AnkiDroidProbeTest

  release:
    needs: device-tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop
        fetch-depth: 0

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # See 'Supported distributions' for available options
        java-version: '17'
        cache: 'gradle'

    - name: Set the version
      id: version
      run: python3 scripts/version.py ${{ inputs.stage }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Build before pushing anything: a failing build leaves develop and main untouched.
    - name: Build with Gradle (lint and unit tests)
      run: ./gradlew build assembleDebug

    # Final release only: the Android App Bundle signed with the upload key, attached to the GitHub release and
    # uploaded to the Play Console by hand. The key comes from the UPLOAD_KEYSTORE_BASE64 (the .jks file in base64)
    # and UPLOAD_KEYSTORE_PASSWORD secrets; without them, the release goes on without the bundle.
    - name: Build the signed bundle for the Play Store
      id: bundle
      if: inputs.stage == 'final'
      env:
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        ORG_GRADLE_PROJECT_microreviewUploadStorePassword: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      run: |
        if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$ORG_GRADLE_PROJECT_microreviewUploadStorePassword" ]; then
          echo "::warning::No upload key secrets: the release has no Play Store bundle."
          exit 0
        fi
        KEYSTORE="$RUNNER_TEMP/upload.jks"
        echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
        ORG_GRADLE_PROJECT_microreviewUploadStoreFile="$KEYSTORE" ./gradlew bundleRelease
        rm -f "$KEYSTORE"
        echo "aab=${{ env.main_project_module }}/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"

    - name: Commit and tag (and merge into main for a final release)
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "Release $VERSION"
        if [ "${{ inputs.stage }}" = "final" ]; then
          git checkout main
          git merge --no-ff develop -m "Release $VERSION"
          git tag "v$VERSION"
          git push origin develop main "v$VERSION"
        else
          git tag "v$VERSION"
          git push origin develop "v$VERSION"
        fi

    # Release notes since the last final release, so a candidate and its release list everything new.
    - name: Publish the release with the APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        APK="Micro-Review-for-AnkiDroid-v$VERSION.apk"
        cp ${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk "$APK"
        FILES=("$APK")
        if [ -n "${{ steps.bundle.outputs.aab }}" ]; then
          AAB="Micro-Review-for-AnkiDroid-v$VERSION.aab"
          cp "${{ steps.bundle.outputs.aab }}" "$AAB"
          FILES+=("$AAB")
        fi
        PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -v -e '-rc' -e "^v$VERSION\$" | head -n 1 || true)
        ARGS=(--title "v$VERSION" --generate-notes)
        if [ -n "$PREVIOUS" ]; then ARGS+=(--notes-start-tag "$PREVIOUS"); fi
        if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
          ARGS+=(--prerelease --target develop)
        else
          ARGS+=(--latest --target main)
        fi
        gh release create "v$VERSION" "${FILES[@]}" "${ARGS[@]}"
